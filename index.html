<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series de TV</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <!-- Columna izquierda - Lista de series -->
            <div class="col-md-8">
                <h2>Series de TV</h2>
                
                <!-- AGREGAR ESTA SECCIÓN DEL PROMEDIO -->
                <div class="alert alert-secondary mb-3">
                    <strong>Promedio de temporadas:</strong> 
                    <span id="promedio-temporadas">0</span>
                </div>

                <form style="margin:10px;">
                    <div class="form-row">
                        <div class="col">
                            <input type="text" class="form-control" id="search-box" placeholder="Filtrar por nombre">
                        </div>
                        <div class="col">
                            <button type="button" id="button-filterByName" class="btn btn-success">Aplicar</button>
                        </div>
                    </div>
                </form>

                <table class="table">
                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Channel</th>
                            <th>Nombre</th>
                            <th>Temporadas</th>
                        </tr>
                    </thead>
                    <tbody id="courses"></tbody>
                </table>
            </div>

            <!-- Columna derecha - Detalles de la serie -->
            <div class="col-md-4">
                <div id="serie-details" style="display: none;">
                    <div class="card">
                        <img id="detail-imagen" class="card-img-top" src="" alt="Imagen de la serie">
                        <div class="card-body">
                            <h5 id="detail-nombre" class="card-title"></h5>
                            <p id="detail-canal" class="card-text"></p>
                            <p id="detail-temporadas" class="card-text"></p>
                            <p id="detail-descripcion" class="card-text"></p>
                            <p id="detail-enlace" class="card-text"></p>
                        </div>
                    </div>
                </div>
                <div id="no-selection" class="alert alert-info">
                    Selecciona una serie para ver sus detalles
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./scripts/course.js"></script>
    <script type="module" src="./scripts/dataCourses.js"></script>
    <script type="module" src="./scripts/main.js"></script>
</body>
</html>
